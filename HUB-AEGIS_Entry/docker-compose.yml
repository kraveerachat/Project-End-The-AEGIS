# AEGIS Entry — routing-only static entry (ไม่มี DB, ไม่มี session — by design)
# ใช้: docker compose up -d --build
# หมายเหตุ: compose ฉบับ "ทั้งระบบ" (macvlan VLAN 10 + postgres ของ Drive/Monitor)
# จะอยู่ที่รากของ workspace ใน Phase 4
services:
  app:
    build: .
    # static nginx — ไม่มี env ให้ตั้ง เพราะไม่มี secret/session/DB โดยเจตนา
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ใบรับรองสำหรับ listen 443 (ดู nginx.conf) — self-signed หรือ internal CA
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      aegis_drive_proxy:
        ipv4_address: 172.19.255.2
    restart: unless-stopped
    healthcheck:
      # ยิง 443 ตรง ๆ — พอร์ต 80 ใน nginx.conf เป็น 301 → https อย่างเดียว
      # ไม่มี /healthz อยู่ที่นั่น (--no-check-certificate เพราะเป็น internal CA)
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  # Created during the separately approved production deploy. Only HUB and
  # Drive join this boundary; Drive receives alias "drive-proxy" there.
  aegis_drive_proxy:
    external: true
    name: aegis_drive_proxy
