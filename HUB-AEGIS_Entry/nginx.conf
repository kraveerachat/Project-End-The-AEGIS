# AEGIS Entry (HUB) — production NGINX config
#
# บทบาท: HUB คือ "ประตูเดียว" (single entry point) บน VLAN 10 — เสิร์ฟหน้า static
# landing page ของ HUB เองบนพอร์ต 443 แล้ว proxy_pass คำขอ /drive และ /monitor ไปหา
# แอปปลายทางแต่ละตัวบน internal IP:port ของมัน (ดู AEGIS_System network table)
#
# ทำไมต้องเป็น path สัมพัทธ์ (/drive, /monitor) บน origin เดียวกัน แทนที่จะ redirect
# ตรงไปที่ IP:port ของแอปปลายทาง:
#   - ผู้ใช้มือถือเข้าผ่าน Twingate ZTNA ซึ่งเปิดให้เห็นแค่ "แอปเดียว" (พอร์ต 443 ของ
#     HUB เท่านั้น) ไม่มี L3 visibility เข้าไปยัง VLAN 10 โดยตรง — ถ้า HUB สั่ง
#     window.location ไปที่ 192.168.10.11:8001 ตรง ๆ ผู้ใช้กลุ่มนี้จะต่อไม่ติด
#   - ผู้ใช้ desktop ผ่าน OpenVPN (VLAN 30) เข้าถึง IP เหล่านี้ได้อยู่แล้วผ่าน
#     inter-VLAN routing แต่การ proxy ผ่าน origin เดียวยังคงถูกต้องและสม่ำเสมอ
#     สำหรับผู้ใช้ทั้งสองกลุ่ม จึงเลือกใช้แบบเดียวกันทั้งหมด
#
# หมายเหตุ: ตัว HUB (ทั้ง React app และ nginx.conf นี้) ไม่รู้จัก username/session/role
# ของผู้ใช้เลย — เป็นแค่ตัวจัดเส้นทางเครือข่าย (routing-only) ตามสถาปัตยกรรม
# Identity Decoupling: การล็อกอินจริงเกิด "หลัง" proxy_pass ในแอปปลายทางแต่ละตัว

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ─── HUB — static landing page + reverse proxy ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Docker DNS resolves the Drive alias on the dedicated HUB→Drive proxy
    # network. The production network is created only by the later deploy task.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # แก้ path ให้ตรงกับใบรับรองจริงตอน deploy (self-signed หรือ internal CA ก็ได้
    # เพราะระบบนี้ไม่ออกอินเทอร์เน็ตสาธารณะ — ดู deploy/README.md)
    ssl_certificate     /etc/nginx/certs/aegis.crt;
    ssl_certificate_key /etc/nginx/certs/aegis.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers — nginx เป็นเจ้าของนโยบายนี้เพียงผู้เดียว เพราะ HUB เสิร์ฟ
    # static ตรงจาก nginx ไม่มี Express และไม่มีโฟลเดอร์ server/ อีกต่อไป
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ─── Landing page (static build output — HUB มีแต่ dist/ ไม่มี server-side state) ─
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"service":"aegis-entry","ok":true,"role":"routing-only"}';
    }

    # การ์ดบน HUB นำไปที่ '/drive' ไม่มี trailing slash (ดู public/config.json) —
    # เติม slash ก่อน เพื่อให้ location prefix ด้านล่างจับคู่ได้ถูกต้อง
    # (nginx ไม่ถือว่า '/drive' เป็น prefix ของ '/drive/')
    location = /drive { return 301 /drive/; }

    # ─── /drive/* → IDEA1 AEGIS Drive (192.168.10.11:8001) ───────────────
    #
    # ⚠️ แก้บั๊ก 2026-07-26: คอมเมนต์เดิมตรงนี้เขียนว่า "ห้ามใช้ rewrite ตัด /drive ออก
    #    เพราะแอปปลายทาง mount ตัวเองที่ base path /drive" — ข้อความนั้น **ไม่ตรงกับโค้ดจริง**
    #    `IDEA1/server/app.js` ใช้ `express.static(DIST)` และ `app.use('/api', …)` ที่ ROOT
    #    ไม่เคย mount ที่ /drive เลย ผลคือ backend ได้รับ '/drive/assets/…' และ '/drive/api/…'
    #    ซึ่งไม่ตรง route ไหน → ตกไปที่ SPA fallback แล้วคืน index.html (200 text/html)
    #    ให้กับคำขอ .js/.css → เบราว์เซอร์ได้ HTML แทน JS module = จอขาว
    #    และ POST /drive/api/login ตอบ 404 = ล็อกอินไม่ได้เลย (วัดจริงแล้วทั้งสองอย่าง)
    #
    #    วิธีแก้: ตัด prefix ที่ nginx เหมือนที่ `gateway/nginx.conf` ทำอยู่แล้วและผ่านการ
    #    ทดสอบมาแล้ว — ฝั่ง frontend ยังคง "รู้จัก" prefix ผ่าน vite `base: '/drive/'` +
    #    import.meta.env.BASE_URL (asset URL และ apiFetch() ถูก build มาเป็น '/drive/...'
    #    อยู่แล้ว) nginx จึงเป็นคนตัด prefix ออกก่อนส่งต่อให้ backend ที่ไม่รู้จัก prefix
    #    เลือกทางนี้แทนการเพิ่ม BASE_PATH ใน server/app.js โดยเจตนา — นั่นจะต้องแก้โค้ดที่
    #    IDEA2 ใช้ร่วมกันด้วยโดยไม่ได้ประโยชน์เพิ่ม ในเมื่อฝั่ง nginx พิสูจน์แล้วว่าใช้ได้
    #
    # ⚠️ `rewrite ... break` ต้องอยู่ "ก่อน" proxy_pass และ proxy_pass ต้องไม่มีส่วน URI
    #    ต่อท้าย — nginx จะส่ง URI ที่ถูก rewrite แล้วไปให้ backend
    location /drive/ {
        set $drive_upstream drive-proxy:8001;
        rewrite ^/drive/?(.*)$ /$1 break;
        proxy_pass http://$drive_upstream;
        proxy_http_version 1.1;

        # ⚠️ $http_host ไม่ใช่ $host — ต่างกันที่ "พอร์ต" และมันสำคัญกับ CSRF:
        #    $host  = ชื่อโฮสต์ที่ **ตัดพอร์ตออกแล้ว** (localhost)
        #    $http_host = ค่า header Host ดิบ ๆ ที่เบราว์เซอร์ส่งมา (localhost:8443)
        #    ชั้นที่ 2 ของ CSRF ในทั้งสองแอปเทียบ `new URL(origin).host !== req.headers.host`
        #    (ดู server/middleware/csrf.js) และ Origin ของเบราว์เซอร์ "มีพอร์ตติดมาด้วย"
        #    เสมอเมื่อไม่ใช่พอร์ตมาตรฐาน → $host ทำให้ Host เหลือ 'localhost' ขณะที่
        #    Origin เป็น 'localhost:8443' = ไม่ตรงกัน = 403 CSRF_ORIGIN_MISMATCH
        #    ทั้งที่รหัสผ่านถูกต้อง (วัดจริงแล้ว: $host → 403, $http_host → 200)
        #
        #    บนพอร์ต 443 มาตรฐานทั้งสองค่าให้ผลเหมือนกัน (เบราว์เซอร์ไม่ใส่ :443 ใน Host
        #    และ URL API ก็ไม่ใส่ :443 ใน origin.host) — จึง "ไม่ใช่บั๊กที่เห็นอยู่วันนี้"
        #    แต่เป็นกับดักที่รอวันเปลี่ยนพอร์ต deploy แล้วล็อกอินพังทั้งระบบโดยไม่มีใคร
        #    เดาได้ว่าเกี่ยวกับ nginx เพราะ UI จะโชว์แค่ "คำขอถูกปฏิเสธ"
        #    ปิดกับดักไว้เลย: $http_host ถูกต้องทั้งบน :443 และบนพอร์ตอื่น
        #
        #    X-Forwarded-Host ก็ใช้ $http_host ด้วยเหตุผลเดียวกัน — ตอนนี้ยังไม่มีโค้ด
        #    ฝั่งแอปอ่านมันเลย (grep แล้ว = 0 จุด) แต่ถ้าปล่อยให้ค่าไม่ตรงกับ Host ไว้
        #    คนที่มาอ่านทีหลังจะเจอบั๊กแบบเดียวกันซ้ำอีกรอบ
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # อัปโหลดไฟล์ใหญ่ได้ (Uploads screen) — ปรับตามเครื่องจริงถ้าจำเป็น
        client_max_body_size 512m;

        # ─── LFT-V2-C: หนึ่ง request = หนึ่ง chunk ที่มีขอบเขต ─────────────
        # location ลูกทุกตัวต้องประกาศ execution trio เอง: set + rewrite + proxy_pass
        # (rewrite-module instructions และ proxy handler ของ parent ไม่ทำงานใน child)
        # แต่ยังสืบทอด HTTP/1.1, trusted proxy headers, Forwarded clearing และ security
        # headers จาก /drive/ นี้โดยเจตนา ห้ามประกาศส่วนเหล่านั้นซ้ำในลูก
        # เพราะ add_header/proxy_set_header ที่ซ้ำกัน
        # จะสร้างจุด drift ใหม่และอาจทำให้ header inheritance เปลี่ยนความหมาย
        #
        # ใช้ ~* และ /?$ ให้ตรงกับ Express ที่ไม่บังคับ case/strict routing — มิฉะนั้น
        # ผู้ส่งอาจเปลี่ยนตัวพิมพ์หรือเติม slash เพื่อหลุดกลับไปใช้เพดาน V1 512m ได้
        location ~* ^/drive/api/files/uploads/[^/]+/chunks/[^/]+/?$ {
            set $drive_upstream drive-proxy:8001;
            rewrite ^/drive/?(.*)$ /$1 break;
            proxy_pass http://$drive_upstream;
            client_max_body_size 64m;
            proxy_request_buffering off;
            client_body_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Vault ciphertext เต็มก้อน = plaintext สูงสุด 64 MiB + GCM tag 16 bytes
        # จึงต้องมี headroom มากกว่า 64m; 65m ยังเป็นเพดาน request ที่เล็กและชัดเจน
        location ~* ^/drive/api/vault/uploads/[^/]+/chunks/[^/]+/?$ {
            set $drive_upstream drive-proxy:8001;
            rewrite ^/drive/?(.*)$ /$1 break;
            proxy_pass http://$drive_upstream;
            client_max_body_size 65m;
            proxy_request_buffering off;
            client_body_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # body ของ commit เล็ก แต่ Drive อาจอ่านและ hash staged file หลาย GiB ก่อนตอบ
        # 600s อยู่ต่ำกว่า commit lease 15 นาที และไม่ขยาย timeout ของ route อื่น
        location ~* ^/drive/api/files/uploads/[^/]+/commit/?$ {
            set $drive_upstream drive-proxy:8001;
            rewrite ^/drive/?(.*)$ /$1 break;
            proxy_pass http://$drive_upstream;
            proxy_read_timeout 600s;
        }

        location ~* ^/drive/api/vault/uploads/[^/]+/commit/?$ {
            set $drive_upstream drive-proxy:8001;
            rewrite ^/drive/?(.*)$ /$1 break;
            proxy_pass http://$drive_upstream;
            proxy_read_timeout 600s;
        }

        # Drive ส่งข้อมูลเป็น stream อยู่แล้ว จึงไม่ให้ nginx สะสม response ลง temp file
        # เฉพาะ whole-file download และ Vault V2 bounded chunk download เท่านั้น
        location ~* ^/drive/api/files/[^/]+/download/?$ {
            set $drive_upstream drive-proxy:8001;
            rewrite ^/drive/?(.*)$ /$1 break;
            proxy_pass http://$drive_upstream;
            proxy_buffering off;
        }

        location ~* ^/drive/api/vault/blobs/[^/]+/chunks/[^/]+/?$ {
            set $drive_upstream drive-proxy:8001;
            rewrite ^/drive/?(.*)$ /$1 break;
            proxy_pass http://$drive_upstream;
            proxy_buffering off;
        }

        # ─── Security headers: nginx เป็นเจ้าของคนเดียวสำหรับ /drive/* ────────
        # ⚠️ กฎ nginx ที่พลาดกันบ่อย: ถ้า location ใดมี `add_header` แม้แค่ตัวเดียว
        #    add_header ทั้งหมดจาก server block จะ **ไม่ถูกสืบทอด** ลงมาเลย
        #    ดังนั้นเมื่อจะประกาศ CSP ของ /drive เอง ก็ต้องประกาศตัวที่เหลือซ้ำที่นี่ด้วย
        #    ไม่งั้น /drive/* จะเหลือแต่ header ที่ Express ส่งมา (หลุดการรับประกันของ nginx)
        #
        # และ proxy_hide_header ทั้งชุด เพื่อไม่ให้ซ้อนกับที่ Express ส่งมา —
        # เดิมทุก header ซ้ำสองชุด ที่ร้ายที่สุดคือ CSP: ของ Express มี 'wasm-unsafe-eval'
        # แต่ของ nginx ไม่มี และเบราว์เซอร์บังคับใช้ "ส่วนที่เข้มที่สุดของทุก header รวมกัน"
        # → Argon2id (hash-wasm) ของ Private Vault รันไม่ได้ ทั้งที่ Express ตั้งใจอนุญาตไว้
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Permissions-Policy;

        # ⚠️ 'wasm-unsafe-eval' อยู่เฉพาะที่นี่เท่านั้น (เฉพาะ /drive/*) เพราะมีแค่
        #    Private Vault ของ IDEA1 ที่ต้องคอมไพล์ WebAssembly — /monitor และ HUB
        #    ยังคงใช้ CSP ที่เข้มกว่าของ server block ตามเดิม ไม่ผ่อนให้โดยไม่จำเป็น
        #    keyword นี้แคบกว่า 'unsafe-eval' มาก: อนุญาตแค่สร้าง WebAssembly module
        #    ไม่เปิด eval(), ไม่เปิด new Function() (ดู IDEA1/server/middleware/securityHeaders.js)
        #
        # ⚠️ blob: อยู่เฉพาะ img-src และ media-src ของ /drive/* เท่านั้น (แก้บั๊ก 2026-08-28):
        #    PR #41 เพิ่ม blob: ให้ CSP ของ Express แล้วและ deploy Drive สำเร็จ แต่ Preview
        #    ของ Private Vault ยังพังในเบราว์เซอร์จริง เพราะบรรทัด proxy_hide_header ด้านบน
        #    "ซ่อน" CSP ของ Express ทิ้งโดยเจตนา แล้ว nginx ประกาศ CSP ของตัวเองแทน
        #    → CSP ที่ถูกแก้ที่ IDEA1 ไม่เคยไปถึงเบราว์เซอร์เลย บรรทัดนี้ต่างหากที่เป็น
        #    "เจ้าของตัวจริง" ของ CSP ที่เบราว์เซอร์เห็นบน /drive/* (วัดจริงแล้วผ่าน HTTPS:
        #    https://aegis.internal/drive/healthz คืน img-src 'self' data: ไม่มี blob:)
        #
        #    Private Vault ถอดรหัสไฟล์ในเบราว์เซอร์แล้วส่งให้ <img>/<video> ผ่าน
        #    URL.createObjectURL() — blob: จึงเป็น "แหล่งข้อมูลในแท็บตัวเอง" ไม่ใช่ปลายทาง
        #    บนเน็ตเวิร์ก เซิร์ฟเวอร์ยังไม่เคยเห็น plaintext/ชื่อไฟล์/MIME/กุญแจ
        #    media-src ต้อง "ประกาศใหม่" ไม่ใช่แค่ขยาย เพราะถ้าไม่ประกาศจะตกไปใช้
        #    default-src 'self' ซึ่งเป็นตัวที่บล็อก <video src="blob:…"> อยู่
        #    ไม่ให้ blob: กับ script-src/default-src เด็ดขาด — blob: ที่นี่ "แสดงผลได้
        #    แต่ execute ไม่ได้" และไม่ให้ data: กับ media-src เพราะวิดีโอที่ถอดรหัสแล้ว
        #    ไม่เคยมาในรูป data: URL
        #
        #    บรรทัดนี้ต้อง "เท่ากันเชิงความหมาย" กับ CSP ของ
        #    IDEA1-AEGIS_Drive_LC/server/middleware/securityHeaders.js เสมอ —
        #    มี HUB-AEGIS_Entry/tests/driveCspParity.test.mjs บังคับข้อนี้ไว้
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # การ์ดบน HUB นำไปที่ '/monitor' ไม่มี trailing slash (ดู public/config.json) —
    # เติม slash ก่อน ด้วยเหตุผลเดียวกับ /drive ด้านบน
    location = /monitor { return 301 /monitor/; }

    # ─── /monitor/internal/* → บล็อกจากภายนอกเสมอ (defense-in-depth) ─────
    #
    # ⚠️ บล็อกนี้ต้องอยู่ใน "คอมมิตเดียวกัน" กับ rewrite ด้านล่าง ห้ามแยกเป็นสองรอบ:
    #    ก่อนแก้ ทุก path ใต้ /monitor/internal/ ตอบ 404 อยู่แล้ว — แต่เป็น 404 ที่ออกมา
    #    จาก Express (`Cannot POST /monitor/internal/detections`) เพราะ prefix ไม่ถูกตัด
    #    ไม่ใช่ 404 ที่มาจาก "นโยบาย" ของ edge เลย พูดอีกอย่างคือพื้นผิวนี้ถูกบังไว้ด้วย
    #    "บั๊ก" ไม่ใช่ด้วยการตัดสินใจ พอเติม rewrite ตัด prefix ปลายทางจะกลายเป็น
    #    /internal/detections ที่ ingest ของจริงทันที (วัดแล้ว: ยิงตรงไป
    #    192.168.10.12:8002/internal/detections ได้ 201 Created + เขียนลงตาราง detections)
    #    → แก้ routing โดยไม่มีบล็อกนี้ = เปิดพื้นผิว service-to-service ingest ให้ทุกคน
    #    ที่เข้าถึงพอร์ต 443 ของ HUB ได้ ในคอมมิตเดียวกันนั้นเอง
    #
    # endpoint กลุ่ม /internal เป็น ingest ของ Detection Engine (Laptop, VLAN 20) —
    # ต้องเข้าถึงจาก "ในเครือข่าย" ตรงไปที่ 192.168.10.12:8002 เท่านั้น ไม่ใช่ผ่าน HUB
    # ที่เป็นประตูสาธารณะ แม้ endpoint จะมี API key (X-Detection-Engine-Key) กั้นอยู่แล้ว
    # ก็ไม่เปิดพื้นผิวนี้ทิ้งไว้ให้ภายนอก — ปิดที่ชั้น edge อีกชั้น
    #
    # ⚠️ ทำไมที่นี่ใช้ regex `~*` ไม่ใช่ literal prefix `location /monitor/internal/`
    #    แบบที่ `gateway/nginx.conf` ใช้: location แบบ prefix ของ nginx เป็น
    #    **case-sensitive** แต่ Express match path แบบ **case-INSENSITIVE** ตามค่า
    #    เริ่มต้น (ไม่ได้เปิด `caseSensitive`) — วัดจริงกับ monitor:8002 แล้ว:
    #    POST /Internal/detections · /INTERNAL/detections · /internal/Detections
    #    → **201 Created ทั้งหมด** ดังนั้น guard แบบ literal จะถูกข้ามได้ด้วยการพิมพ์
    #    /monitor/Internal/detections เฉย ๆ (ตัว `gateway/nginx.conf` ก็มีช่องเดียวกันนี้
    #    — รายงานไว้แล้ว ยังไม่แก้เพราะอยู่นอกขอบเขตคอมมิตนี้)
    #    `~*` ปิดครบทุกรูปแบบตัวพิมพ์ · `(/|$)` ครอบทั้ง `/monitor/internal` เปล่า ๆ และ
    #    ทุก path ใต้มัน โดยไม่เผลอบล็อก path อื่นที่ขึ้นต้นคล้ายกัน (เช่น /monitor/internal-x)
    #
    # ⚠️ ลำดับการเลือก location ของ nginx: `=` ก่อน → literal prefix ที่ยาวที่สุด (จำไว้)
    #    → regex ตามลำดับที่เขียนในไฟล์ "ตัวแรกที่ match ชนะและทับ prefix ที่จำไว้"
    #    ดังนั้นบล็อกนี้ชนะ `location /monitor/` ด้านล่างเสมอ ไม่ขึ้นกับลำดับการเขียน
    #    และเป็น regex location **ตัวเดียวในไฟล์** จึงไม่มีการแย่งลำดับกับใครเลย
    location ~* ^/monitor/internal(/|$) { return 404; }

    # ─── /monitor/* → IDEA2 AEGIS Monitor (192.168.10.12:8002) ───────────
    #
    # ⚠️ แก้บั๊กเดียวกับ /drive/ เป๊ะ ๆ (2026-07-26): `IDEA2/server/index.js` ใช้
    #    `express.static(DIST)` และ `app.use('/api', …)` ที่ ROOT ไม่เคย mount ที่
    #    /monitor เลย เดิม config นี้ forward path เต็มแบบไม่ตัด prefix → backend ได้
    #    '/monitor/assets/…' และ '/monitor/api/…' ซึ่งไม่ตรง route ไหน → ตกไปที่ SPA
    #    fallback แล้วคืน index.html (200 text/html 587B) ให้กับคำขอ .js/.css
    #    → เบราว์เซอร์ได้ HTML แทน JS module = จอขาว และ POST /monitor/api/login
    #    ตอบ 404 = ล็อกอินไม่ได้เลย (วัดจริงแล้วทั้งสองอย่างผ่าน config ฉบับนี้)
    #
    #    วิธีแก้เหมือน /drive/: ตัด prefix ที่ nginx — ฝั่ง frontend ยังคง "รู้จัก" prefix
    #    ผ่าน vite `base: '/monitor/'` + import.meta.env.BASE_URL (asset URL และ
    #    apiFetch() ถูก build มาเป็น '/monitor/...' อยู่แล้ว)
    location /monitor/ {
        rewrite ^/monitor/?(.*)$ /$1 break;
        proxy_pass http://192.168.10.12:8002;
        proxy_http_version 1.1;
        # ⚠️ $http_host ไม่ใช่ $host — ดูเหตุผลเต็มที่ location /drive/ ด้านบน
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
