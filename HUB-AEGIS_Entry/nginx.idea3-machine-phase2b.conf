# AEGIS HUB — IDEA3 machine route (Phase 2B, mTLS). NOT ACTIVE YET.
#
# This file is reviewed here but is deliberately NOT included by nginx.conf.
# Including it before the K9/K10 material exists would make `nginx -t` fail on
# the missing certificate, client-CA, and CRL files, and Phase 2A installs
# nginx.conf as-is. It is activated only in the separately authorized Phase 2B
# window, once all of these exist under the HUB certificate mount:
#
#   /etc/nginx/certs/idea3-core.aegis.internal.crt   server certificate, SAN carries the name (K9, Kla)
#   /etc/nginx/certs/idea3-core.aegis.internal.key   server key, generated on the server, never copied
#   /etc/nginx/certs/idea3-machine-client-ca.crt     dedicated IDEA3 client CA (K10, Kla holds the CA key offline)
#   /etc/nginx/certs/idea3-machine-client-ca.crl     CRL; an expired CRL makes NGINX refuse every client (fails closed)
#
# Activation appends this block to the production artifact, then `nginx -t` and
# `nginx -s reload`. The HUB is not recreated for Phase 2B.
#
# Contract (Phase 2 design IR-2, asserted by tests/idea3RoutingContract.test.mjs):
#   - a separate server certificate, never the browser certificate: a shared
#     certificate would let a browser coalesce HTTP/2 connections across the
#     browser and machine server blocks;
#   - mTLS is mandatory; $ssl_client_verify is SUCCESS only after verification
#     against the dedicated client CA and the CRL;
#   - only the machine sub-path is proxied, to the machine listener on :8004;
#     everything else returns 404;
#   - the identity headers are set from the verified certificate, so any
#     client-supplied copy is overwritten; Cookie, Origin and every forwarded
#     header are cleared, because IDEA3 refuses a machine request that carries
#     browser identity.

# ─── IDEA3 machine route — idea3-core.aegis.internal (mTLS, Core only) ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name idea3-core.aegis.internal;

    ssl_certificate         /etc/nginx/certs/idea3-core.aegis.internal.crt;
    ssl_certificate_key     /etc/nginx/certs/idea3-core.aegis.internal.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    ssl_client_certificate  /etc/nginx/certs/idea3-machine-client-ca.crt;
    ssl_crl                 /etc/nginx/certs/idea3-machine-client-ca.crl;
    ssl_verify_client       on;
    ssl_verify_depth        1;

    location /security/api/machine/v1/ {
        proxy_pass http://172.31.243.3:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Aegis-Client-Verify $ssl_client_verify;
        proxy_set_header X-Aegis-Client-Dn $ssl_client_s_dn;
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 8k;
    }

    location / { return 404; }
}
