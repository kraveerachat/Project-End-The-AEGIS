worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 65m;
    client_body_timeout 120s;
    send_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 18443;

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /run/aegis-h1-tls/tls.crt;
        ssl_certificate_key /run/aegis-h1-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 444;
    }

    server {
        listen 443 ssl;
        server_name idea2-h1.aegis-lab.internal;

        ssl_certificate /run/aegis-h1-tls/tls.crt;
        ssl_certificate_key /run/aegis-h1-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = / {
            return 302 /monitor/;
        }

        # The browser surface never exposes Monitor internal service routes.
        location ~* ^/monitor/internal(?:/|$) {
            return 404;
        }

        location /monitor/ {
            proxy_http_version 1.1;
            proxy_pass http://monitor:8002;
        }

        # Exact Agent ingress allowlist. The /agent prefix is the only rewrite.
        location = /agent/internal/agent-auth/challenge {
            limit_except POST { deny all; }
            proxy_pass http://monitor:8002/internal/agent-auth/challenge$is_args$args;
        }

        location = /agent/internal/agent-auth/verify {
            limit_except POST { deny all; }
            proxy_pass http://monitor:8002/internal/agent-auth/verify$is_args$args;
        }

        location = /agent/internal/heartbeat {
            limit_except POST { deny all; }
            proxy_pass http://monitor:8002/internal/heartbeat$is_args$args;
        }

        location = /agent/internal/detections {
            limit_except POST { deny all; }
            proxy_pass http://monitor:8002/internal/detections$is_args$args;
        }

        location = /agent/internal/alerts {
            limit_except POST { deny all; }
            proxy_pass http://monitor:8002/internal/alerts$is_args$args;
        }

        location = /agent/internal/clips {
            limit_except POST { deny all; }
            proxy_pass http://monitor:8002/internal/clips$is_args$args;
        }

        location ~* ^/agent(?:/|$) {
            return 404;
        }

        location ~* ^/internal(?:/|$) {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
