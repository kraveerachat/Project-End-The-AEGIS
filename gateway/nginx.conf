# AEGIS Gateway — localhost testing reverse proxy (HTTP-only, port 80)
#
# ⚠️ นี่คือ config สำหรับทดสอบบนเครื่อง dev ด้วย `docker-compose up` เท่านั้น
# (HTTP ล้วน ไม่มี TLS, service name แทน IP จริงบน VLAN 10) production ใช้
# HUB-AEGIS_Entry/nginx.conf แยกต่างหาก (HTTPS/443 + IP จริงของ edge node)
#
# ทำไมต้อง rewrite ตัด /drive และ /monitor ออกก่อน proxy_pass (ต่างจาก production
# ที่ forward path เต็มแบบไม่ตัด): ที่นี่ backend ของ Drive/Monitor รันแบบ standalone
# (mount /api และ static ที่ root เหมือนตอน dev ผ่าน vite proxy) ไม่ได้ตั้งค่า
# BASE_PATH ของตัวเอง — ฝั่ง frontend ก็ยังคง "รู้จัก" prefix ผ่าน vite `base` +
# import.meta.env.BASE_URL (asset URL และ apiFetch() ทุกจุดถูก build มาเป็น
# '/drive/...' / '/monitor/...' อยู่แล้ว) ดังนั้น nginx เป็นคนตัด prefix ออกก่อน
# ส่งต่อให้ backend ที่ไม่รู้จัก prefix นั้น
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── DNS: อย่า cache IP ของ backend ไว้ตั้งแต่ตอนบูต ─────────────────────
    # ⚠️ ปัญหาที่แก้: ถ้าเขียน `proxy_pass http://drive:8001;` ตรง ๆ nginx จะ resolve
    #    ชื่อ 'drive' "ครั้งเดียวตอน start" แล้วจำ IP นั้นไว้ตลอดอายุโปรเซส พอ
    #    `docker compose up -d drive` สร้างคอนเทนเนอร์ใหม่ (ได้ IP ใหม่บน bridge
    #    network) gateway จะยิงไปหา IP เก่าที่ไม่มีใครฟังแล้ว → 502 ทั้งที่ backend
    #    healthy สมบูรณ์ ต้อง restart gateway เองทุกครั้ง — ยิ่งใกล้ deploy จริงยิ่ง
    #    เกิดบ่อย (ทุกครั้งที่ deploy ทีละ service)
    # 127.0.0.11 = embedded DNS ของ Docker (มีอยู่ในทุก user-defined network)
    # valid=10s  = ทิ้ง cache ทุก 10 วิ คอนเทนเนอร์ที่เพิ่งเกิดใหม่ถูกเจอในไม่กี่วินาที
    # ipv6=off   = เครือข่าย compose นี้เป็น IPv4 ล้วน ไม่ต้องเสียเวลารอ AAAA ที่ไม่มีวันมา
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ─── health check ของ gateway เอง (docker healthcheck ยิงมาที่นี่) ────────
    # ตอบจาก nginx ตรง ๆ ไม่ proxy ไปไหน จึงไม่แตะ DNS เลย — resolver ด้านบนครอบ
    # ทั้ง server block อยู่แล้วแต่ไม่มีอะไรให้ resolve ที่นี่ และ "ต้องเป็นแบบนั้น":
    # health ของ gateway ต้องวัดว่า "ตัว router ยังรับ request ได้ไหม" เท่านั้น
    # ถ้าเอาไป proxy หา drive/monitor gateway จะกลายเป็น unhealthy ตามไปด้วยเวลา
    # backend ล่ม แล้ว docker จะรีสตาร์ท router ที่ยังดีอยู่ทิ้งโดยไม่จำเป็น
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"aegis-gateway","ok":true,"role":"routing-only"}';
    }

    # การ์ดบน HUB นำไปที่ '/drive' / '/monitor' ไม่มี trailing slash (ดู
    # HUB-AEGIS_Entry/public/config.json) — เติม slash ก่อน เพื่อให้ location
    # prefix ด้านล่างจับคู่ได้ถูกต้อง (nginx ไม่ถือว่า '/drive' เป็น prefix ของ '/drive/')
    location = /drive { return 301 /drive/; }
    location = /monitor { return 301 /monitor/; }

    # ─── /drive/* → IDEA1 AEGIS Drive (container 'drive', :8001) ─────────
    # ⚠️ ต้องผ่านตัวแปร ($drive_upstream) ห้ามใส่ชื่อ host ตรง ๆ ใน proxy_pass —
    #    ชื่อ host ที่เขียนตรง ๆ ถูก resolve ตอน start แล้ว cache ตลอดไป แต่พอเป็น
    #    ตัวแปร nginx จะ resolve ใหม่ตอน runtime ผ่าน resolver ด้านบน (ตาม valid=10s)
    #    นี่คือวิธีมาตรฐานของ nginx ในการบังคับ re-resolve ไม่ใช่ทริก
    # ⚠️ `rewrite ... break` ยังต้องอยู่ "ก่อน" proxy_pass เหมือนเดิม และ proxy_pass
    #    ต้องไม่มีส่วน URI ต่อท้ายตัวแปร — nginx จะส่ง URI ที่ถูก rewrite แล้วไปให้
    #    backend (พฤติกรรมเดิมทุกประการ backend จึงยังไม่รู้จัก prefix /drive)
    location /drive/ {
        set $drive_upstream drive-proxy:8001;
        rewrite ^/drive/?(.*)$ /$1 break;
        proxy_pass http://$drive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 512m; # อัปโหลดไฟล์ใหญ่ได้ (Uploads screen)
    }

    # ─── /monitor/internal/* → บล็อกจากภายนอกเสมอ (defense-in-depth) ─────
    # endpoint กลุ่ม /internal เป็น service-to-service ingest ของ Detection Engine
    # (Laptop, VLAN 20) — ต้องเข้าถึงจาก "ในเครือข่าย" ตรงไปที่ monitor:8002 เท่านั้น
    # ไม่ใช่ผ่าน gateway สาธารณะ (พอร์ต 80) แม้ endpoint จะมี API key ป้องกันอยู่แล้ว
    # ก็ไม่เปิดพื้นผิวนี้ให้โลกภายนอกทิ้งไว้ — ปิดที่ชั้น edge อีกชั้น
    # ⚠️ nginx เลือก location แบบ longest-prefix — บล็อกนี้จึงชนะ location /monitor/
    #    ด้านล่างสำหรับทุก path ใต้ /monitor/internal/ (ไม่ขึ้นกับลำดับการเขียน)
    location /monitor/internal/ { return 404; }

    # ─── /monitor/* → IDEA2 AEGIS Monitor (container 'monitor', :8002) ───
    # ผ่านตัวแปรด้วยเหตุผลเดียวกับ /drive/ ด้านบน (re-resolve ตอน runtime)
    location /monitor/ {
        set $monitor_upstream monitor:8002;
        rewrite ^/monitor/?(.*)$ /$1 break;
        proxy_pass http://$monitor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ─── HUB landing page (static build — ไม่มี /api ของตัวเอง) ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
