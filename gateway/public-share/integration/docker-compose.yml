# PUBLIC-SHARE-6 internal integration harness. NOT a Production stack.
#
# This is the first harness in the repository that puts the REAL PUBLIC-SHARE-3
# gateway image in front of the REAL AEGIS Drive application on a REAL
# PostgreSQL 15 database. PUBLIC-SHARE-3's own harness proves gateway config
# fidelity against a purpose-built recorder; PUBLIC-SHARE-5 proves the security
# matrix against the Express app in-process. Neither of them ever connected the
# two, which is exactly what PUBLIC-SHARE-6 exists to do.
#
# ⚠️ IT CHANGES NOTHING OUTSIDE ITSELF.
#    Its own project name, its own three networks, its own containers, its own
#    anonymous volumes, its own throwaway credentials. It reads no .env, mounts
#    no Production path, publishes no host port, and touches no Production
#    database, gateway, network or migration. Everything is removed by
#    `docker compose down --volumes --remove-orphans`.
#
# ⚠️ NO HOST PORT EXISTS ANYWHERE IN THIS FILE, deliberately. Every network is
#    `internal: true` with `gateway_mode_ipv4: isolated`, so Docker has neither a
#    default route nor a host-bridge address to offer. Requests are generated
#    from inside the topology by the member that is supposed to generate them.
#
# ── Topology, and why it is three networks and not one ────────────────────────
#
#   recipient ──edge──▶ gateway ──upstream──▶ drive ──data──▶ postgres
#
#    The recipient sits ONLY on the edge network, so "the recipient cannot reach
#    Drive except through the gateway" is enforced by Docker and is testable,
#    rather than being a property we assert about a diagram. PUBLIC-SHARE-3's
#    single-network harness could not make that claim: there, the client WAS the
#    upstream.
#
#    The gateway is dual-homed across edge and upstream and is on nothing else.
#    B5 (Gateway -> everything else = nothing) is unchanged and still holds: both
#    of its networks are internal and isolated, so it has no Internet path, no
#    host path, and no route to PostgreSQL. Being able to reach its one upstream
#    is the point of a gateway; being able to reach anything further is not.
#
#    PostgreSQL is on the data network only. The gateway cannot resolve it, and
#    neither can the recipient.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${PS6_SUPER_USER:?PS6_SUPER_USER is required}
      POSTGRES_PASSWORD: ${PS6_SUPER_PASSWORD:?PS6_SUPER_PASSWORD is required}
      POSTGRES_DB: postgres
      # Consumed by db-init/00-aegis-drive.sh. Generated per run by the test.
      DRIVE_DB_PASSWORD: ${PS6_DRIVE_DB_PASSWORD:?PS6_DRIVE_DB_PASSWORD is required}
    volumes:
      # Read-only mounts of the repository's own SQL. Nothing is copied or
      # re-typed here, so the harness cannot drift from the shipped schema.
      - ../../../IDEA1-AEGIS_Drive_LC/server/db/schema.sql:/sql-src/idea1-schema.sql:ro
      - ../../../IDEA1-AEGIS_Drive_LC/server/db/seed.sql:/sql-src/idea1-seed.sql:ro
      - ../../../IDEA1-AEGIS_Drive_LC/server/db/migrations:/sql-src/migrations:ro
      - ./db-init/00-aegis-drive.sh:/docker-entrypoint-initdb.d/00-aegis-drive.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aegis_drive"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      aegis_ps6_data:
        ipv4_address: 172.31.252.2

  # The REAL AEGIS Drive application, built from its own shipped Dockerfile.
  drive:
    build:
      context: ../../../IDEA1-AEGIS_Drive_LC
    environment:
      NODE_ENV: production
      PORT: 8001
      SESSION_SECRET: ${PS6_SESSION_SECRET:?PS6_SESSION_SECRET is required}
      # This harness terminates plain HTTP end to end; there is no TLS to make a
      # Secure cookie returnable. Production is unaffected and unchanged.
      COOKIE_SECURE: "false"
      # The peers whose forwarding headers are believed.
      #
      # ⚠️ This is the production "State B" pair, and it is NOT a free choice.
      #    config/trustedProxy.js refuses to boot under NODE_ENV=production when
      #    PUBLIC_SHARE_GATEWAY_CIDR is set unless this variable contains EXACTLY
      #    the approved HUB proxy identity (172.19.255.2/32) and the gateway —
      #    no more, no fewer. Naming a gateway without trusting it would collapse
      #    attribution onto the gateway's own address and produce the T-05
      #    self-DoS, so the configuration is refused rather than half-started.
      #
      #    The HUB identity is listed because Production carries it; no such peer
      #    exists on these networks, which is exactly why the forged-header test
      #    still measures something. A harness that quietly dropped it would be
      #    testing a deployment shape Production will never have.
      TRUSTED_PROXY_CIDRS: 172.19.255.2/32,172.31.251.2/32
      # The ONE peer that counts as arriving through the Public Share Gateway.
      # Same address, different question: TRUSTED_PROXY_CIDRS answers "may I
      # believe this peer's headers", PUBLIC_SHARE_GATEWAY_CIDR answers "is this
      # peer the public ingress". Outside 172.18.0.0/16, as config/publicShare.js
      # requires.
      PUBLIC_SHARE_GATEWAY_CIDR: 172.31.251.2/32
      # Must match the gateway's server_name, because the gateway authors the
      # upstream Host header from it and public URLs are built from this alone.
      PUBLIC_SHARE_BASE_URL: https://share.example.invalid
      # Deliberately NOT set to "true". PS6 is internal integration; the UI
      # activation signal is G6's to flip, not this harness's.
      PUBLIC_SHARE_UI_ENABLED: "false"
      DATABASE_URL: postgresql://drive_app:${PS6_DRIVE_DB_PASSWORD}@postgres:5432/aegis_drive
      STORAGE_ROOT: /datalake
    # An anonymous volume, removed by `down --volumes`. No Production named
    # volume (drive_storage) is referenced anywhere in this file.
    volumes:
      - /datalake
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8001/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 45
    networks:
      aegis_ps6_data:
        ipv4_address: 172.31.252.3
      aegis_ps6_upstream:
        ipv4_address: 172.31.251.3

  # The REAL PUBLIC-SHARE-3 gateway. Same Dockerfile, same nginx.conf.template,
  # same entrypoint and host validator — the build context is the parent
  # directory on purpose, so this harness cannot test a modified gateway.
  public-share-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PUBLIC_SHARE_HOST: share.example.invalid
    depends_on:
      drive:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      aegis_ps6_edge:
        ipv4_address: 172.31.250.2
      aegis_ps6_upstream:
        ipv4_address: 172.31.251.2

  # The external recipient. It holds no AEGIS code, no credential and no volume;
  # it exists to be a client on the far side of the gateway. It runs the stock
  # node image so the harness cannot accidentally give the recipient a capability
  # a real Internet client would not have.
  recipient:
    image: node:20-alpine
    command: ["sleep", "infinity"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      aegis_ps6_edge:
        ipv4_address: 172.31.250.3

networks:
  # All three carry BOTH controls. `internal` removes normal external and
  # default-route connectivity; `gateway_mode_ipv4: isolated` additionally
  # removes the Docker-host bridge address, which an ordinary internal bridge
  # keeps and through which host services stay reachable. Removing either one
  # to make a host port work would break the boundary this harness measures.
  aegis_ps6_edge:
    name: aegis_ps6_edge
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: "isolated"
    ipam:
      config:
        - subnet: 172.31.250.0/29
          gateway: 172.31.250.1

  aegis_ps6_upstream:
    name: aegis_ps6_upstream
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: "isolated"
    ipam:
      config:
        - subnet: 172.31.251.0/29
          gateway: 172.31.251.1

  aegis_ps6_data:
    name: aegis_ps6_data
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: "isolated"
    ipam:
      config:
        - subnet: 172.31.252.0/29
          gateway: 172.31.252.1
