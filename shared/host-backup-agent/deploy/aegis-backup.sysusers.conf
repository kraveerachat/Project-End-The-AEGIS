# systemd-sysusers definition for the AEGIS host backup agent.
#
# A third dedicated identity. It is NOT aegis-telemetry (29100) and NOT
# aegis-disk-health (29101): a Drive container that can read host metrics
# must not thereby be able to trigger a backup, and the backup agent must
# not be able to publish telemetry. Different UID, different GID, different
# socket.
#
# The credential files are root:aegis-backup 0640, so only root and this
# agent can read them:
#   /etc/aegis/backup-agent.pgpass            (pgpass format, one line)
#   /etc/aegis/backup-agent.restic-password   (one line)
#
# Install (as root, on the host — NOT performed by this task):
#   install -m 0644 aegis-backup.sysusers.conf /usr/lib/sysusers.d/
#   systemd-sysusers
#
#Type Name          ID     GECOS                     Home Shell
u     aegis-backup  29102  "AEGIS host backup agent" -    /usr/sbin/nologin
