# systemd-sysusers definition for the AEGIS host disk-health collector.
#
# A second dedicated identity, separate from aegis-telemetry on purpose: this
# one holds CAP_SYS_RAWIO for the duration of a oneshot run, the agent never
# does. The collector's PRIMARY group is set in the unit (Group=aegis-telemetry)
# so the evidence file lands readable by the agent and by nothing else.
#
# UID 29101 is pinned next to the agent's 29100. Nothing in Drive joins this
# UID; Drive only ever reads the agent's socket.
#
# Install (as root, on the host — NOT performed by this task):
#   install -m 0644 aegis-disk-health.sysusers.conf /usr/lib/sysusers.d/
#   systemd-sysusers
#
#Type Name               ID     GECOS                             Home Shell
u     aegis-disk-health  29101  "AEGIS host disk-health collector" -    /usr/sbin/nologin
