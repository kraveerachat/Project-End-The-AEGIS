# systemd-sysusers definition for the AEGIS host telemetry agent.
#
# The numeric ID is fixed, not allocated. Drive joins GID 29100 through
# group_add, and a container's supplementary group is a NUMBER — if the host
# ever allocated a different GID, Drive would silently lose access to the socket
# while everything else still looked healthy.
#
# Preflight confirmed 29100 free on the host and free inside the Drive image.
#
# Install (as root, on the host — NOT performed by this task):
#   install -m 0644 aegis-telemetry.sysusers.conf /usr/lib/sysusers.d/
#   systemd-sysusers
#
#Type Name             ID     GECOS                          Home Shell
u     aegis-telemetry  29100  "AEGIS host telemetry agent"   -    /usr/sbin/nologin
