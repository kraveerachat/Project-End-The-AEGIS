# systemd-sysusers definition for the AEGIS local Twingate connector collector.
#
# A third dedicated identity, separate from aegis-telemetry and
# aegis-disk-health on purpose: this one is added to the `docker` group for the
# duration of a oneshot run, and neither of the others ever is. The collector's
# PRIMARY group is set in the unit (Group=aegis-telemetry) so the evidence file
# lands readable by the agent and by nothing else.
#
# UID 29102 is pinned next to the agent's 29100 and the disk collector's 29101.
# Nothing in Drive joins this UID; Drive only ever reads the agent's socket, and
# Drive is never added to `docker`.
#
# ⚠️ Adding this user to `docker` is equivalent to granting it root on the host.
#    That is why it is a separate identity used by one short-lived unit that runs
#    a single fixed read-only command, rather than a permission held by the
#    long-running agent.
#
# Install (as root, on the host — NOT performed by this task):
#   install -m 0644 aegis-twingate-health.sysusers.conf /usr/lib/sysusers.d/
#   systemd-sysusers
#
#Type Name                   ID     GECOS                                    Home Shell
u     aegis-twingate-health  29102  "AEGIS Twingate connector collector"      -    /usr/sbin/nologin
