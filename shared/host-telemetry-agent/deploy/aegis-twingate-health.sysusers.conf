# systemd-sysusers definition for the AEGIS local Twingate connector collector.
#
# The FOURTH dedicated host identity in this deployment, and the second one that
# belongs to the telemetry toolchain. The AEGIS host identity map is:
#
#   29100  aegis-telemetry      long-running agent; reads files, serves a socket
#   29101  aegis-disk-health    oneshot; holds CAP_SYS_RAWIO for one device
#   29102  aegis-backup         host backup agent (shared/host-backup-agent/)
#   29103  aegis-twingate-health  this unit; oneshot, joins the `docker` group
#
# ⚠️ 29102 IS ALREADY TAKEN — do not reuse it here. It belongs to `aegis-backup`
#    (see shared/host-backup-agent/deploy/aegis-backup.sysusers.conf), and it is
#    not merely reserved on paper: the backup agent is deployed, and the Drive
#    container joins GID 29102 via `group_add` to reach /run/aegis-backup. An
#    identity collision there would hand this collector's group membership to a
#    socket Drive already talks to, and vice versa. A read-only production
#    preflight confirmed 29100/29101/29102 are in use and 29103 (UID and GID)
#    is free.
#
# This collector is separate from all three because it is the only one added to
# the `docker` group, and that membership is equivalent to root on the host. Its
# PRIMARY group is set in the unit (Group=aegis-telemetry) so the evidence file
# lands readable by the telemetry agent and by nothing else.
#
# Nothing in Drive joins this UID or GID. Drive only ever reads the telemetry
# agent's socket, and Drive is never added to `docker`.
#
# Install (as root, on the host — NOT performed by this task):
#   install -m 0644 aegis-twingate-health.sysusers.conf /usr/lib/sysusers.d/
#   systemd-sysusers
#
#Type Name                   ID     GECOS                                Home Shell
u     aegis-twingate-health  29103  "AEGIS Twingate connector collector"  -    /usr/sbin/nologin
